services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-techtombola}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-techtombola}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - techtombola-net

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["bun", "migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-techtombola}
      JWT_SECRET: ${JWT_SECRET:-insecure_default_change_me_to_at_least_32_characters}
      SESSION_SECRET: ${SESSION_SECRET:-insecure_default_change_me_to_at_least_32_characters}
    restart: "no"
    networks:
      - techtombola-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-techtombola}
      JWT_SECRET: ${JWT_SECRET:-insecure_default_change_me_to_at_least_32_characters}
      SESSION_SECRET: ${SESSION_SECRET:-insecure_default_change_me_to_at_least_32_characters}
      SUPER_ADMIN_BOOTSTRAP_SECRET: ${SUPER_ADMIN_BOOTSTRAP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://127.0.0.1}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@techtombola.internal}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - techtombola-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - techtombola-net

volumes:
  postgres_data:
    driver: local

networks:
  techtombola-net:
    driver: bridge
