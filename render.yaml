projects:
  - name: tech-tombola
    environments:
      - name: production
        services:
          - type: web
            name: backend
            runtime: docker
            region: singapore
            plan: 0.5c-512mb
            dockerfilePath: ./backend/Dockerfile
            dockerContext: ./backend
            autoDeployTrigger: commit
            healthCheckPath: /health
            preDeployCommand: bun migrate.js
            envVars:
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: DATABASE_URL
                value: postgresql://neondb_owner:npg_BWyHZM8eKQL0@ep-sweet-dawn-az7vrdy9-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
              - key: DATABASE_URL_UNPOOLED
                value: postgresql://neondb_owner:npg_BWyHZM8eKQL0@ep-sweet-dawn-az7vrdy9.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
              - key: JWT_SECRET
                generateValue: true
              - key: SESSION_SECRET
                generateValue: true
              - key: FRONTEND_HOST
                fromService:
                  name: frontend
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
              - key: SUPER_ADMIN_BOOTSTRAP_SECRET
                sync: false
              - key: LOG_LEVEL
                value: info

          - type: web
            name: frontend
            runtime: docker
            region: singapore
            plan: 0.5c-512mb
            dockerfilePath: ./frontend/Dockerfile
            dockerContext: ./frontend
            autoDeployTrigger: commit
            healthCheckPath: /
            envVars:
              - key: BACKEND_HOST
                fromService:
                  name: backend
                  type: web
                  property: hostport
              - key: NGINX_ENVSUBST_FILTER
                value: BACKEND_HOST
              - key: RENDER_EXTERNAL_HOSTNAME
                fromService:
                  name: frontend
                  type: web
                  envVarKey: RENDER_EXTERNAL_HOSTNAME
